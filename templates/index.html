<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Trading Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-hover: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #334155;
            --accent: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #06b6d4;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-title h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .market-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
        }

        .market-status.open {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .market-status.closed {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .account-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .stat-change {
            font-size: 14px;
            margin-top: 5px;
        }

        .stat-change.positive { color: var(--success); }
        .stat-change.negative { color: var(--danger); }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }

        .tab {
            padding: 10px 20px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px 8px 0 0;
            transition: all 0.2s;
        }

        .tab:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .tab.active {
            background: var(--accent);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 20px;
            font-weight: 600;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table thead {
            background: rgba(59, 130, 246, 0.1);
            border-bottom: 2px solid var(--accent);
        }

        .data-table th,
        .data-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .data-table th {
            font-weight: 600;
            color: var(--accent);
        }

        .data-table tbody tr:hover {
            background: var(--bg-hover);
        }

        .badge {
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-success { background: rgba(16, 185, 129, 0.1); color: var(--success); }
        .badge-danger { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
        .badge-warning { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
        .badge-info { background: rgba(6, 182, 212, 0.1); color: var(--info); }

        .positive { color: var(--success); }
        .negative { color: var(--danger); }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state div {
            margin-bottom: 10px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .setting-group {
            background: rgba(59, 130, 246, 0.05);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 8px;
            padding: 20px;
        }

        .setting-group h3 {
            margin-bottom: 15px;
            font-size: 16px;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .setting-item {
            margin-bottom: 15px;
        }

        .setting-item:last-child {
            margin-bottom: 0;
        }

        .setting-item label {
            display: block;
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .setting-item input[type="text"],
        .setting-item input[type="number"] {
            width: 100%;
            padding: 8px 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 14px;
        }

        .setting-item input[type="text"]:focus,
        .setting-item input[type="number"]:focus {
            outline: none;
            border-color: var(--accent);
        }

        .setting-item .toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .setting-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .setting-item small {
            display: block;
            margin-top: 5px;
            font-size: 12px;
        }

        .log-entry {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
            background: var(--bg-card);
        }

        .log-entry.error,
        .log-entry.stopped {
            border-left: 4px solid var(--danger);
        }

        .log-entry.warning,
        .log-entry.high,
        .log-entry.critical {
            border-left: 4px solid var(--warning);
        }

        .log-entry.ok,
        .log-entry.success {
            border-left: 4px solid var(--success);
        }

        .log-time {
            color: var(--text-secondary);
            font-size: 12px;
            margin-right: 10px;
        }

        .score-bar {
            width: 100%;
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 5px;
        }

        .score-fill {
            height: 100%;
            background: linear-gradient(to right, var(--danger), var(--warning), var(--success));
            transition: width 0.3s;
        }

        .refresh-timer {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid var(--text-secondary);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            animation: fadeIn 0.2s ease-out;
        }

        .modal-overlay.active {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid var(--border);
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease-out;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px;
            border-bottom: 1px solid var(--border);
        }

        .modal-header h2 {
            font-size: 24px;
            color: var(--text-primary);
            margin: 0;
        }

        .modal-close {
            background: var(--bg-hover);
            border: none;
            color: var(--text-primary);
            font-size: 24px;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: var(--danger);
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 25px;
        }

        .detail-section {
            margin-bottom: 25px;
        }

        .detail-section:last-child {
            margin-bottom: 0;
        }

        .detail-section h3 {
            font-size: 16px;
            color: var(--accent);
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .detail-item {
            background: rgba(59, 130, 246, 0.05);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(59, 130, 246, 0.15);
        }

        .detail-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .strategy-card {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .strategy-card:last-child {
            margin-bottom: 0;
        }

        .strategy-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .strategy-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .strategy-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }

        .strategy-metric {
            display: flex;
            flex-direction: column;
        }

        .strategy-metric-label {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .strategy-metric-value {
            font-size: 16px;
            font-weight: 600;
            margin-top: 2px;
        }

        .metadata-item {
            background: var(--bg-dark);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            border-left: 3px solid var(--accent);
        }

        .metadata-key {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .metadata-value {
            font-size: 14px;
            color: var(--text-primary);
            word-break: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="header-content">
                <div class="header-title">
                    <h1>🤖 Enhanced Trading Bot</h1>
                    <div class="market-status" id="marketStatus">
                        <span class="status-dot"></span>
                        <span id="marketStatusText">Checking...</span>
                    </div>
                </div>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <span class="refresh-timer" id="refreshTimer">Auto-refresh: 20s</span>
                    <button class="btn btn-primary" onclick="refreshAll()">
                        <span id="refreshBtn">🔄 Refresh Now</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Account Summary -->
        <div class="account-summary" id="accountSummary">
            <div class="stat-card">
                <div class="stat-label">Account Equity</div>
                <div class="stat-value" id="equity">$0.00</div>
                <div class="stat-change" id="equityChange">+0.00%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Buying Power</div>
                <div class="stat-value" id="buyingPower">$0.00</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Open Positions</div>
                <div class="stat-value" id="positionCount">0</div>
                <div class="stat-change" id="exposurePct">0% exposure</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Daily P/L</div>
                <div class="stat-value" id="dailyPL">$0.00</div>
                <div class="stat-change" id="dailyPLPct">0.00%</div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab('positions')">📊 Positions</button>
            <button class="tab" onclick="switchTab('candidates')">🎯 Candidates</button>
            <button class="tab" onclick="switchTab('settings')">⚙️ Settings</button>
            <button class="tab" onclick="switchTab('logs')">📝 Logs & Status</button>
        </div>

        <!-- Positions Tab -->
        <div class="tab-content active" id="positions-tab">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Current Positions</h2>
                    <button class="btn btn-sm btn-danger" onclick="closeAllPositions()">Close All</button>
                </div>
                <div id="positionsTable"></div>
            </div>
        </div>

        <!-- Candidates Tab -->
        <div class="tab-content" id="candidates-tab">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Top Candidates</h2>
                    <span class="badge badge-info" id="candidateCount">0 candidates</span>
                </div>
                <div id="candidatesTable"></div>
            </div>
        </div>

        <!-- Settings Tab -->
        <div class="tab-content" id="settings-tab">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Bot Settings</h2>
                    <button class="btn btn-success" onclick="saveSettings()">💾 Save Settings</button>
                </div>
                <div class="settings-grid" id="settingsGrid"></div>
            </div>
        </div>

        <!-- Logs Tab -->
        <div class="tab-content" id="logs-tab">
            <div class="grid-2">
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">System Health</h2>
                    </div>
                    <div id="healthStatus"></div>
                </div>
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Recent Events</h2>
                    </div>
                    <div id="eventsLog"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Candidate Detail Modal -->
    <div class="modal-overlay" id="candidateModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2 id="modalTitle">Candidate Details</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Content will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <script>
        let refreshInterval;
        let countdown = 20;
        let candidatesData = []; // Store candidates for modal access

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            refreshAll();
            startAutoRefresh();
        });

        function startAutoRefresh() {
            refreshInterval = setInterval(() => {
                countdown--;
                if (countdown <= 0) {
                    countdown = 20;
                    refreshAll();
                }
                document.getElementById('refreshTimer').textContent = `Auto-refresh: ${countdown}s`;
            }, 1000);
        }

        async function refreshAll() {
            document.getElementById('refreshBtn').innerHTML = '<span class="spinner"></span> Refreshing...';

            await Promise.all([
                loadAccount(),
                loadPositions(),
                loadCandidates(),
                loadSettings(),
                loadHealth(),
                loadEvents()
            ]);

            document.getElementById('refreshBtn').textContent = '🔄 Refresh Now';
            countdown = 20;
        }

        async function loadAccount() {
            try {
                const data = await fetch('/api/health').then(r => r.json());
                console.log('Health API response:', data);

                // The engine stores all data under 'system' as a JSON string
                let systemData = data.system || data;
                
                // If system is a string, parse it
                if (typeof systemData === 'string') {
                    try {
                        systemData = JSON.parse(systemData);
                        console.log('Parsed system data:', systemData);
                    } catch (e) {
                        console.error('Failed to parse system data:', e);
                    }
                }

                // If systemData has a 'status' property that's a string, parse that too
                if (systemData.status && typeof systemData.status === 'string') {
                    try {
                        systemData = JSON.parse(systemData.status);
                        console.log('Parsed nested system data:', systemData);
                    } catch (e) {
                        // Keep original if parse fails
                    }
                }

                // Now extract account data from the parsed system object
                let account = systemData.account || {};
                console.log('Account data:', account);

                // Extract clock data
                let clock = systemData.clock || {};
                console.log('Clock data:', clock);

                // Update account summary
                const equity = parseFloat(account.equity || 0);
                const buyingPower = parseFloat(account.buying_power || 0);
                const cash = parseFloat(account.cash || 0);

                console.log('Parsed values:', { equity, buyingPower, cash });

                document.getElementById('equity').textContent = formatCurrency(equity);
                document.getElementById('buyingPower').textContent = formatCurrency(buyingPower);

                // Market status
                const marketStatus = document.getElementById('marketStatus');
                const isOpen = clock.is_open || false;
                marketStatus.className = `market-status ${isOpen ? 'open' : 'closed'}`;
                document.getElementById('marketStatusText').textContent = isOpen ? 'Market Open' : 'Market Closed';
                
                console.log('Account loaded successfully');
            } catch (error) {
                console.error('Load account error:', error);
            }
        }

        async function loadPositions() {
            try {
                const data = await fetch('/api/positions').then(r => r.json());
                let positions = data.positions || [];

                // Parse if it's a JSON string
                if (typeof positions === 'string') {
                    try {
                        positions = JSON.parse(positions);
                    } catch (e) {
                        console.error('Failed to parse positions:', e);
                        positions = [];
                    }
                }

                // Ensure it's an array
                if (!Array.isArray(positions)) {
                    console.warn('Positions is not an array:', typeof positions);
                    positions = [];
                }

                console.log('Loaded positions:', positions.length); // DEBUG

                document.getElementById('positionCount').textContent = positions.length;

                if (positions.length === 0) {
                    document.getElementById('positionsTable').innerHTML = `
                        <div class="empty-state">
                            <div style="font-size: 48px;">📊</div>
                            <div>No open positions</div>
                            <div style="margin-top: 10px; font-size: 13px; color: var(--text-secondary);">
                                ${document.getElementById('marketStatusText')?.textContent === 'Market Closed'
                                    ? 'Market is currently closed'
                                    : 'Waiting for entry signals...'}
                            </div>
                        </div>
                    `;
                    document.getElementById('exposurePct').textContent = '0% exposure';
                    document.getElementById('dailyPL').textContent = '$0.00';
                    document.getElementById('dailyPLPct').textContent = '0.00%';
                    return;
                }

                // WE HAVE POSITIONS - RENDER THEM
                let totalValue = 0;
                let totalPL = 0;

                const rows = positions.map(pos => {
                    totalValue += parseFloat(pos.market_value || 0);
                    totalPL += parseFloat(pos.unrealized_pl || 0);
                    const plClass = pos.unrealized_pl >= 0 ? 'positive' : 'negative';

                    return `
                        <tr>
                            <td><strong>${pos.symbol}</strong></td>
                            <td>${pos.qty}</td>
                            <td>${formatCurrency(pos.avg_entry_price)}</td>
                            <td>${formatCurrency(pos.current_price)}</td>
                            <td>${formatCurrency(pos.market_value)}</td>
                            <td class="${plClass}">${formatCurrency(pos.unrealized_pl)}</td>
                            <td class="${plClass}">${(parseFloat(pos.unrealized_plpc) || 0).toFixed(2)}%</td>
                        </tr>
                    `;
                }).join('');

                // Render the table with headers
                document.getElementById('positionsTable').innerHTML = `
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Symbol</th>
                                <th>Qty</th>
                                <th>Avg Price</th>
                                <th>Current</th>
                                <th>Value</th>
                                <th>P/L</th>
                                <th>P/L %</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rows}
                        </tbody>
                    </table>
                `;

                // Update summary stats
                const healthData = await fetch('/api/health').then(r => r.json()).catch(() => null);
                if (healthData) {
                    // Parse system data
                    let systemData = healthData.system || healthData;
                    if (typeof systemData === 'string') {
                        try {
                            systemData = JSON.parse(systemData);
                        } catch (e) {}
                    }
                    
                    // If nested, parse again
                    if (systemData.status && typeof systemData.status === 'string') {
                        try {
                            systemData = JSON.parse(systemData.status);
                        } catch (e) {}
                    }

                    let accountData = systemData.account || {};

                    const equity = parseFloat(accountData.equity || 0);
                    const exposurePct = equity > 0 ? (totalValue / equity * 100).toFixed(1) : 0;
                    const dailyPLPct = equity > 0 ? (totalPL / equity * 100).toFixed(2) : 0;

                    document.getElementById('exposurePct').textContent = `${exposurePct}% exposure`;
                    document.getElementById('dailyPL').textContent = formatCurrency(totalPL);
                    document.getElementById('dailyPLPct').textContent = `${dailyPLPct}%`;

                    // Add color class for P/L
                    const plElement = document.getElementById('dailyPL');
                    plElement.className = totalPL >= 0 ? 'positive' : 'negative';
                }

                console.log('✓ Rendered', positions.length, 'positions'); // DEBUG

            } catch (error) {
                console.error('Error loading positions:', error);
                document.getElementById('positionsTable').innerHTML = `
                    <div class="empty-state">
                        <div style="font-size: 48px;">⚠️</div>
                        <div>Error loading positions</div>
                        <div style="margin-top: 10px; font-size: 13px; color: var(--text-secondary);">
                            ${error.message}
                        </div>
                    </div>
                `;
            }
        }

        async function loadHealth() {
            try {
                const health = await fetch('/api/health').then(r => r.json());
                console.log('Health data:', health);

                if (!health || Object.keys(health).length === 0) {
                    document.getElementById('healthStatus').innerHTML = '<div class="empty-state">No health data available</div>';
                    return;
                }

                let healthItems = [];

                // Parse health data properly
                Object.entries(health).forEach(([key, value]) => {
                    if (key === 'error') return; // Skip error key

                    let parsedValue = value;

                    // If value is a string, try to parse it as JSON
                    if (typeof value === 'string') {
                        try {
                            parsedValue = JSON.parse(value);
                        } catch (e) {
                            parsedValue = { status: value };
                        }
                    }

                    // Ensure we have an object
                    if (typeof parsedValue !== 'object' || parsedValue === null) {
                        parsedValue = { status: String(parsedValue) };
                    }

                    // Handle nested status object (double-encoded JSON)
                    if (parsedValue.status && typeof parsedValue.status === 'string') {
                        try {
                            const nestedData = JSON.parse(parsedValue.status);
                            if (typeof nestedData === 'object') {
                                parsedValue = { ...parsedValue, ...nestedData };
                            }
                        } catch (e) {
                            // Keep original if not JSON
                        }
                    }

                    const status = (parsedValue.status || 'OK').toString().toUpperCase();
                    const statusBadge = 
                        status === 'ERROR' || status === 'CRITICAL' ? 'danger' :
                        status === 'HIGH' || status === 'WARNING' || status === 'STOPPED' ? 'warning' :
                        status === 'OK' || status === 'SUCCESS' ? 'success' : 'info';

                    // Build details section
                    let details = '';
                    Object.entries(parsedValue).forEach(([k, v]) => {
                        if (k === 'status') return; // Skip status, shown in badge
                        if (v === null || v === undefined) return;

                        const label = k.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                        
                        if (k === 'violations' && Array.isArray(v) && v.length > 0) {
                            details += `<div style="margin-top: 8px; padding: 8px; background: rgba(239, 68, 68, 0.1); border-radius: 6px;">`;
                            details += `<strong>⚠️ Violations:</strong><br/>`;
                            v.forEach(violation => {
                                details += `<div style="margin-left: 16px; margin-top: 4px;">• ${violation}</div>`;
                            });
                            details += `</div>`;
                        } else if (typeof v === 'boolean') {
                            const icon = v ? '✓' : '✗';
                            const color = v ? 'var(--success)' : 'var(--danger)';
                            details += `<div style="margin-top: 5px;"><strong>${label}:</strong> <span style="color: ${color}">${icon} ${v ? 'Yes' : 'No'}</span></div>`;
                        } else if (typeof v === 'number') {
                            let formatted;
                            if (k.includes('pct') || k.includes('percent')) {
                                formatted = `${v.toFixed(2)}%`;
                            } else if (k.includes('equity') || k.includes('cash') || k.includes('power')) {
                                formatted = formatCurrency(v);
                            } else if (k.includes('count')) {
                                formatted = v.toString();
                            } else {
                                formatted = v.toLocaleString();
                            }
                            details += `<div style="margin-top: 5px;"><strong>${label}:</strong> ${formatted}</div>`;
                        } else if (typeof v === 'object' && !Array.isArray(v)) {
                            details += `<div style="margin-top: 10px; padding-left: 12px; border-left: 3px solid var(--border);"><strong>${label}:</strong></div>`;
                            Object.entries(v).forEach(([subK, subV]) => {
                                const subLabel = subK.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                                let subFormatted = subV;
                                if (typeof subV === 'number') {
                                    if (subK.includes('pct')) subFormatted = `${subV.toFixed(2)}%`;
                                    else if (subK.includes('price') || subK.includes('value')) subFormatted = formatCurrency(subV);
                                }
                                details += `<div style="margin-left: 20px; margin-top: 4px; color: var(--text-secondary); font-size: 14px;">${subLabel}: ${subFormatted}</div>`;
                            });
                        } else if (Array.isArray(v) && v.length > 0) {
                            details += `<div style="margin-top: 5px;"><strong>${label}:</strong> [${v.join(', ')}]</div>`;
                        } else if (v.toString().trim()) {
                            details += `<div style="margin-top: 5px;"><strong>${label}:</strong> ${v}</div>`;
                        }
                    });

                    // Create health card
                    const componentName = key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                    healthItems.push(`
                        <div class="log-entry">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                                <strong style="font-size: 16px; color: var(--text-primary);">${componentName}</strong>
                                <span class="badge badge-${statusBadge}" style="font-size: 13px;">${status}</span>
                            </div>
                            ${details || '<div style="color: var(--text-secondary); font-style: italic; font-size: 14px;">No additional details</div>'}
                        </div>
                    `);
                });

                document.getElementById('healthStatus').innerHTML = healthItems.length > 0 ? 
                    healthItems.join('') : 
                    '<div class="empty-state">No health components found</div>';
                    
            } catch (error) {
                console.error('Load health error:', error);
                document.getElementById('healthStatus').innerHTML = `
                    <div class="empty-state">
                        <div>❌ Failed to load health data</div>
                        <div style="font-size: 13px; color: var(--text-secondary); margin-top: 8px;">${error.message}</div>
                    </div>`;
            }
        }

        async function loadEvents() {
            try {
                console.log('Fetching events from /api/status...');
                const response = await fetch('/api/status');
                const data = await response.json();
                console.log('Events response:', data);
                
                const events = data.events || [];
                console.log(`Found ${events.length} events`);

                if (events.length === 0) {
                    document.getElementById('eventsLog').innerHTML = `
                        <div class="empty-state">
                            <div>📋 No events logged yet</div>
                            <div style="font-size: 13px; color: var(--text-secondary); margin-top: 8px;">
                                Events will appear here when the trading bot performs actions
                            </div>
                        </div>`;
                    return;
                }

                const eventsHTML = events.slice(0, 100).map((event, index) => {
                    // Handle different timestamp field names
                    const timestamp = event.timestamp || event.ts || event.time || '';
                    const type = (event.event_type || event.type || 'info').toLowerCase();
                    const message = event.message || event.msg || event.text || 'No message';
                    const details = event.details || event.detail || '';
                    
                    // Format timestamp
                    let formattedTime = 'Unknown time';
                    if (timestamp) {
                        try {
                            formattedTime = new Date(timestamp).toLocaleString('en-US', {
                                month: 'short',
                                day: 'numeric',
                                hour: '2-digit',
                                minute: '2-digit',
                                second: '2-digit'
                            });
                        } catch (e) {
                            formattedTime = timestamp;
                        }
                    }

                    // Determine type badge style
                    let typeBadge, typeIcon;
                    switch(type) {
                        case 'error':
                        case 'critical':
                            typeBadge = 'danger';
                            typeIcon = '❌';
                            break;
                        case 'warning':
                        case 'warn':
                            typeBadge = 'warning';
                            typeIcon = '⚠️';
                            break;
                        case 'success':
                            typeBadge = 'success';
                            typeIcon = '✓';
                            break;
                        case 'trade':
                        case 'order':
                            typeBadge = 'info';
                            typeIcon = '💰';
                            break;
                        default:
                            typeBadge = 'info';
                            typeIcon = 'ℹ️';
                    }

                    return `
                        <div class="log-entry" style="border-left: 3px solid var(--${typeBadge === 'danger' ? 'danger' : typeBadge === 'warning' ? 'warning' : typeBadge === 'success' ? 'success' : 'info'});">
                            <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 6px;">
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <span style="font-size: 16px;">${typeIcon}</span>
                                    <span class="badge badge-${typeBadge}" style="font-size: 11px; text-transform: uppercase;">${type}</span>
                                </div>
                                <span class="log-time" style="font-size: 12px; color: var(--text-secondary);">${formattedTime}</span>
                            </div>
                            <div style="margin-top: 6px; color: var(--text-primary); font-size: 14px;">
                                ${message}
                            </div>
                            ${details ? `<div style="margin-top: 6px; padding: 8px; background: rgba(255,255,255,0.03); border-radius: 4px; font-size: 13px; color: var(--text-secondary); font-family: monospace;">${details}</div>` : ''}
                        </div>
                    `;
                }).join('');

                document.getElementById('eventsLog').innerHTML = eventsHTML;
                console.log('Events rendered successfully');
                
            } catch (error) {
                console.error('Load events error:', error);
                document.getElementById('eventsLog').innerHTML = `
                    <div class="empty-state">
                        <div>❌ Failed to load events</div>
                        <div style="font-size: 13px; color: var(--text-secondary); margin-top: 8px;">
                            ${error.message}
                        </div>
                        <button class="btn btn-sm btn-primary" onclick="loadEvents()" style="margin-top: 12px;">
                            🔄 Retry
                        </button>
                    </div>`;
            }
        }

            try {
                const response = await fetch('/api/positions/close-all', {
                    method: 'POST'
                });
                const result = await response.json();

                if (result.status === 'success') {
                    alert(`✅ ${result.message}\n\nClosed: ${result.closed.join(', ')}\n` + 
                          (result.failed.length > 0 ? `Failed: ${result.failed.join(', ')}` : ''));
                    await loadPositions();
                } else {
                    alert(`❌ ${result.message}`);
                }
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }

        function switchTab(tabName) {
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');

            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(`${tabName}-tab`).classList.add('active');
        }

        function openCandidateModal(symbol) {
            const candidate = candidatesData.find(c => c.symbol === symbol);
            if (!candidate) {
                console.error('Candidate not found:', symbol);
                return;
            }

            // Set modal title
            document.getElementById('modalTitle').textContent = `${symbol} - Candidate Details`;

            // Build modal content
            const score = candidate.final_score || candidate.score || 0;
            const confidence = candidate.confidence || 0;
            const regime = candidate.regime || 'unknown';
            const strategies = candidate.active_strategies || [];
            const signals = candidate.signals || [];
            const metadata = candidate.metadata || {};
            const isCrypto = candidate.is_crypto || false;

            let modalHTML = `
                <!-- Overview Section -->
                <div class="detail-section">
                    <h3>📊 Overview</h3>
                    <div class="detail-grid">
                        <div class="detail-item">
                            <div class="detail-label">Symbol</div>
                            <div class="detail-value">${symbol} ${isCrypto ? '🪙' : ''}</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Final Score</div>
                            <div class="detail-value" style="color: var(--success);">${(score * 100).toFixed(2)}%</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Confidence</div>
                            <div class="detail-value" style="color: var(--info);">${(confidence * 100).toFixed(2)}%</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Market Regime</div>
                            <div class="detail-value">
                                <span class="badge badge-info">${regime}</span>
                            </div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Active Strategies</div>
                            <div class="detail-value" style="font-size: 14px;">${strategies.length} strategies</div>
                        </div>
                        <div class="detail-item">
                            <div class="detail-label">Asset Type</div>
                            <div class="detail-value" style="font-size: 16px;">${isCrypto ? 'Cryptocurrency' : 'Stock'}</div>
                        </div>
                    </div>
                    <div style="margin-top: 15px;">
                        <div class="score-bar" style="height: 8px;">
                            <div class="score-fill" style="width: ${score * 100}%"></div>
                        </div>
                    </div>
                </div>

                <!-- Strategy Signals Section -->
                <div class="detail-section">
                    <h3>🎯 Strategy Signals (${signals.length})</h3>
                    ${signals.length > 0 ? signals.map(signal => {
                        const signalScore = signal.score || 0;
                        const signalConfidence = signal.confidence || 0;
                        const regimeMatch = signal.regime_match;
                        const details = signal.details || {};

                        return `
                            <div class="strategy-card">
                                <div class="strategy-header">
                                    <div class="strategy-name">${signal.strategy_name || 'Unknown'}</div>
                                    <span class="badge ${regimeMatch ? 'badge-success' : 'badge-warning'}">
                                        ${regimeMatch ? '✓ Regime Match' : '⚠ Regime Mismatch'}
                                    </span>
                                </div>
                                <div class="strategy-metrics">
                                    <div class="strategy-metric">
                                        <div class="strategy-metric-label">Score</div>
                                        <div class="strategy-metric-value" style="color: ${signalScore >= 0.7 ? 'var(--success)' : signalScore >= 0.5 ? 'var(--warning)' : 'var(--danger)'};">
                                            ${(signalScore * 100).toFixed(1)}%
                                        </div>
                                    </div>
                                    <div class="strategy-metric">
                                        <div class="strategy-metric-label">Confidence</div>
                                        <div class="strategy-metric-value" style="color: var(--info);">
                                            ${(signalConfidence * 100).toFixed(1)}%
                                        </div>
                                    </div>
                                </div>
                                ${Object.keys(details).length > 0 ? `
                                    <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border);">
                                        <div style="font-size: 12px; color: var(--text-secondary); margin-bottom: 8px;">Strategy Details:</div>
                                        ${Object.entries(details).map(([key, value]) => {
                                            const label = key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                                            let formattedValue = value;

                                            if (typeof value === 'number') {
                                                if (key.includes('pct') || key.includes('percent')) {
                                                    formattedValue = `${value.toFixed(2)}%`;
                                                } else if (key.includes('price') || key.includes('value')) {
                                                    formattedValue = formatCurrency(value);
                                                } else {
                                                    formattedValue = value.toFixed(4);
                                                }
                                            } else if (typeof value === 'boolean') {
                                                formattedValue = value ? '✓ Yes' : '✗ No';
                                            } else if (Array.isArray(value)) {
                                                formattedValue = value.join(', ');
                                            } else if (typeof value === 'object' && value !== null) {
                                                formattedValue = JSON.stringify(value, null, 2);
                                            }

                                            return `
                                                <div style="display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px;">
                                                    <span style="color: var(--text-secondary);">${label}:</span>
                                                    <span style="color: var(--text-primary); font-weight: 500;">${formattedValue}</span>
                                                </div>
                                            `;
                                        }).join('')}
                                    </div>
                                ` : ''}
                            </div>
                        `;
                    }).join('') : '<div class="empty-state">No strategy signals available</div>'}
                </div>

                <!-- Metadata Section -->
                ${Object.keys(metadata).length > 0 ? `
                    <div class="detail-section">
                        <h3>📋 Additional Metadata</h3>
                        ${Object.entries(metadata).map(([key, value]) => {
                            const label = key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                            let formattedValue = value;

                            if (typeof value === 'number') {
                                if (key.includes('pct') || key.includes('percent')) {
                                    formattedValue = `${value.toFixed(2)}%`;
                                } else if (key.includes('price') || key.includes('value')) {
                                    formattedValue = formatCurrency(value);
                                } else {
                                    formattedValue = value.toLocaleString();
                                }
                            } else if (typeof value === 'boolean') {
                                formattedValue = value ? '✓ Yes' : '✗ No';
                            } else if (Array.isArray(value)) {
                                formattedValue = value.join(', ');
                            } else if (typeof value === 'object' && value !== null) {
                                formattedValue = '<pre style="margin-top: 8px; padding: 8px; background: var(--bg-dark); border-radius: 4px; overflow-x: auto; font-size: 12px;">' + JSON.stringify(value, null, 2) + '</pre>';
                            }

                            return `
                                <div class="metadata-item">
                                    <div class="metadata-key">${label}</div>
                                    <div class="metadata-value">${formattedValue}</div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                ` : ''}
            `;

            document.getElementById('modalBody').innerHTML = modalHTML;
            document.getElementById('candidateModal').classList.add('active');

            // Prevent body scroll when modal is open
            document.body.style.overflow = 'hidden';
        }

        function closeModal(event) {
            // If event is provided and it's not clicking the overlay, don't close
            if (event && event.target.id !== 'candidateModal') {
                return;
            }

            document.getElementById('candidateModal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // Close modal on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        function formatCurrency(value) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD',
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }).format(value || 0);
        }
    </script>
</body>
</html>
