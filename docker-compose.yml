# 24/7 trader service. `restart: always` keeps it running across crashes and
# host reboots. Secrets come from .env (gitignored, never baked into the image).
services:
  trader:
    build: .
    image: trader:latest
    container_name: trader
    restart: always
    # Hardening: the entrypoint needs root only to chown the bind mounts and
    # drop to 'trader' via gosu, so grant exactly the capabilities that path
    # uses and block any privilege re-escalation afterwards. If a future
    # entrypoint change crashes on a permission error, re-check this list.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    env_file:
      - .env
    volumes:
      # Persist the trade journal across restarts/redeploys.
      - ./trade_logs:/app/trade_logs
      # Persist the screened stock-sleeve pool (written weekly by
      # `docker compose run --rm trader python -m trader screen-universe`).
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
